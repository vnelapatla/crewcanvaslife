# Force trigger deployment - 2026-04-22 18:29
name: Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven
      run: |
        mvn clean package
        # Verify the file exists
        ls -lh target/*.jar

    - name: Prepare Server
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          mkdir -p ~/app
          cd ~/app
          
          echo "Clearing disk space to prevent SCP failure..."
          sudo journalctl --vacuum-time=1h || true
          sudo apt-get clean || true
          rm -rf ~/.cache || true
          sudo rm -rf /var/log/mysql/*.log || true
          sudo rm -f ~/app/*.log.* || true
          sudo truncate -s 0 ~/app/app.log || true
          
          echo "Removing old jar files to prevent Text File Busy lock..."
          sudo systemctl stop crewcanvas || true
          rm -f *.jar

    - name: Upload Artifacts via native SCP
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa UPDATE_SCHEMA.sql deploy.sh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/
        scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa target/*.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/

    - name: Execute Standard Deploy
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/app
          # Move files to root of app dir for easier handling
          mv target/*.jar . 2>/dev/null || true
          chmod +x deploy.sh
          
          # Ensure MySQL is running before migration
          echo "Checking MySQL service..."
          sudo systemctl start mariadb || sudo systemctl start mysqld || sudo systemctl start mysql || true
          
          # Apply database migrations first - Using -h 127.0.0.1 to avoid socket issues
          echo "Applying database migrations..."
          mysql -h 127.0.0.1 -u root -proot crewcanvas_db < UPDATE_SCHEMA.sql || echo "Migration notice: Migration might have failed or already applied."
          
          # Run the blue-green deployment script
          ./deploy.sh

    - name: Nginx Optimization
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "Ensuring Nginx client_max_body_size is set..."
          NGINX_CONF="/etc/nginx/nginx.conf"
          if [ -f "$NGINX_CONF" ]; then
            if ! sudo grep -q "client_max_body_size" "$NGINX_CONF"; then
              sudo sed -i '/http {/a \    client_max_body_size 50M;' "$NGINX_CONF"
              sudo nginx -t && sudo systemctl reload nginx
            fi
          fi

