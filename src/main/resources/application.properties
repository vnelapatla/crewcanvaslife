# Application Configuration
spring.profiles.active=mysql

# Application Name
spring.application.name=crewcanvas

# Server Port
server.port=8081

# MySQL Database Configuration
# CC-MAY-002: Multi-Language [M Sumanth] - Enforce UTF-8 for global character support
spring.datasource.url=jdbc:mysql://localhost:3306/crewcanvas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&maxAllowedPacket=209715200&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true


# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Custom Server Header to hide Tomcat version details
server.server-header=CrewCanvas

# Increase JSON payload and header limits for Base64 and complex states
server.max-http-header-size=1MB
server.tomcat.max-http-post-size=200MB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
# Memory Optimization Settings for 1GB RAM environment
server.tomcat.max-threads=50
spring.datasource.hikari.maximum-pool-size=10


# Google OAuth Configuration
google.client.id=804092739623-3khsc57mme7lgb0n7ugj2lg9r43fb1n5.apps.googleusercontent.com

# Email Configuration (SMTP)
# IMPORTANT: For Gmail, you MUST use an 'App Password', NOT your regular password.
# 1. Enable 2-Step Verification in Google Account.
# 2. Search for 'App Passwords' and generate one for 'Mail'.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:crewcanvas2@gmail.com}
spring.mail.password=${SMTP_PASSWORD:vqehfgiglbleoxcq}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.auth.mechanisms=LOGIN PLAIN
spring.mail.properties.mail.debug=true

# Email Control (Set to false for local testing, true for live production)
app.email.enabled=true

# Fix for Lazy Loading errors in JSON
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Graceful Shutdown for Zero-Downtime Deployment
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# PERFORMANCE & LOADING OPTIMIZATION
# 1. Enable HTTP Compression (GZIP) - Drastically reduces transfer size
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# 2. Static Resource Caching - Makes repeat visits instant
# Cache CSS/JS/Images for 1 year (with cache busting via ?v= parameter already in place)
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.enabled=true

# 3. Connection Pooling & Tomcat Tuning for High Throughput
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.min-spare-threads=10


