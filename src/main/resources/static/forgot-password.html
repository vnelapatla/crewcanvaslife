<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CrewCanvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/modern-core.css">
    <link rel="stylesheet" href="css/auth-layout-shared.css">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6911412543302758"
     crossorigin="anonymous"></script>
</head>
<body>
    <main class="main-content">
        <div class="auth-container glass-card animate-fade-up">
            <div class="logo-section">
                <h1 class="gradient-text">Reset Password</h1>
                <p style="color: var(--text-dim); font-size: 14px;">Enter your email to receive a reset link</p>
            </div>

            <div id="messageArea"></div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label style="display: block; margin-bottom: 8px; color: var(--text-dim); font-size: 13px;">Email Address</label>
                    <input type="email" id="email" class="premium-input" placeholder="name@studio.com" required>
                </div>
                <button type="submit" id="submitBtn" class="premium-btn" style="width: 100%;">
                    Send Reset Link
                </button>
            </form>

            <div class="back-to-login">
                <a href="index.html">← Back to Sign In</a>
            </div>
        </div>
    </main>

    <script src="js/utils.js?v=1.2"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageArea = document.getElementById('messageArea');

            submitBtn.disabled = true;
            submitBtn.innerText = 'Sending...';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (response.ok) {
                    const data = await response.json();
                    // If data is an object with message, use it; otherwise fallback to a default success message
                    messageArea.innerText = (data && data.message) ? data.message : 'Reset link has been sent to your email.';
                    messageArea.className = 'success';
                    document.getElementById('forgotPasswordForm').style.display = 'none';
                } else {
                    const errorMsg = await response.text();
                    messageArea.innerText = errorMsg || 'Unable to send reset link. Please verify your email.';
                    messageArea.className = 'error';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Send Reset Link';
                }
                messageArea.style.display = '-webkit-box';
            } catch (error) {
                console.error('Forgot password error:', error);
                messageArea.innerText = 'Something went wrong. Please check your connection and try again.';
                messageArea.className = 'error';
                messageArea.style.display = '-webkit-box';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
